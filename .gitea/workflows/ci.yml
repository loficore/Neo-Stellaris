# CI gate — MANUAL ONLY.  The primary pipeline is `.github/workflows/ci.yml`
# (GitHub-hosted; this repo is public, so those minutes are free and there is no
# reason to spend a local runner slot on them).
#
# This copy exists so the same gate can be run on the local Gitea act_runner
# when GitHub is unreachable or when a job needs the `ns-ci` image (zig + just +
# pytest baked in — see `ci/runner/Dockerfile`).  It is dispatch-only by
# decision: a fallback pipeline that also fires automatically would run every
# gate twice for no added signal.  (Measured 2026-11-05 on this instance —
# Gitea 28.2.0 — a push carrying `.github/workflows/ci.yml` with `on: push:`
# produced no run, so the two directories are not redundant *today*; the fence
# keeps that from mattering either way.)  `scripts/test_ci_workflows.py` pins
# the dispatch-only shape.
#
# RULE, identical to the GitHub copy: offline gates only.  Every `c1_*`/`c2_*`
# live shot, `scripts/windows/game_supervisor.py`, the popup/OCR family and the
# IDA sessions stay out — `docs/roadmap.md` §2 records the live-detour gate as
# 「只在点名时」 with a per-plan shot budget, so automating one would bypass the
# gate instead of exercising it.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-gitea-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  JUST_VERSION: 1.59.0
  JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e

jobs:
  gate:
    # Label registered for the image built from ci/runner/Dockerfile.  Must be
    # glibc: build.zig:44-47 — QuickJS's bundled allocator misbehaves under musl,
    # so the `alpine` label cannot run `zig build test` at all.
    runs-on: ns-ci
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure toolchain (no-op on the ns-ci image)
        run: |
          set -euo pipefail

          if ! command -v zig >/dev/null 2>&1; then
            if ! command -v xz >/dev/null 2>&1; then
              SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
              $SUDO apt-get update -qq && $SUDO apt-get install -y -qq xz-utils
            fi
            curl -fsSL -o /tmp/zig.tar.xz \
              "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
            mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            ln -sf /opt/zig/zig /usr/local/bin/zig
          fi

          if ! command -v just >/dev/null 2>&1; then
            curl -fsSL -o /tmp/just.tar.gz \
              "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
            tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          fi

          if ! python3 -c 'import pytest, capstone, pefile, psutil' >/dev/null 2>&1; then
            python3 -m pip install -q --disable-pip-version-check \
              'pytest==8.4.2' 'capstone==5.0.7' 'pefile==2024.8.26' psutil
          fi

          zig version
          just --version
          python3 -m pytest --version

      - name: "just check-full (same gate as .github/workflows/ci.yml)"
        run: just check-full

      - name: Artifact fingerprints
        run: sha256sum zig-out/bin/stellaris_quickjs.dll zig-out/bin/inject.exe | tee /tmp/sha256sums.txt

      - name: Working tree must be untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the gate mutated the working tree"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
