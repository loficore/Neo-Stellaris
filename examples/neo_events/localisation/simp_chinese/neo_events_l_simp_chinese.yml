l_simp_chinese:
 neo_events.1.title:0 "超空间航路上的信号"
 neo_events.1.desc:0 "一艘无人信使船跳出超空间，带来一张不是我们绘制的星图。\n\n有人早就知道每支舰队必须穿过哪些星系。图上标出了其中一个。"
 neo_events.1.a:0 "交给海军存档。"
 neo_events.2.title:0 "瓶颈报告"
 neo_events.2.desc:0 "我们的交通分析员完成了统计：银河中有一个星系承载的航路比任何地方都多，而只要一座空间站，就能看清所有经过它的航线。\n\n他们请求批准建造。"
 neo_events.2.a:0 "批准建造空间站。"
 neo_events.3.title:0 "一张不属于我们的地图"
 neo_events.3.desc:0 "星图是完整的。它不是星星的地图，而是星星之间道路的地图，上面写明了哪些道路我们无法绕开。\n\n有人把它放在了我们会找到的地方。"
 neo_events.3.a:0 "收下它，什么也别说。"
