# Ruff configuration for the Neo-Stellaris tree.
#
# The C2 family was written before this file existed and uses a house style
# that ruff's defaults disagree with: one grouped `from c2_harness import (...)`
# block per file (ruff wants the members sorted, one per line), printf-style
# formatting in a few format strings, and `zip()` without an explicit
# ``strict=``.  Those are not defects here — they are the shape the existing
# evidence-attached code has, and rewriting them would put unrelated churn
# into a diff whose subject is something else.
#
# 2026-11-05: this file became a *gate* (`just lint`, run by CI) instead of a
# wish list, which forced two decisions to be written down:
#
# 1. `select` is explicit and the ruff version is pinned (0.17.3, in
#    scripts/requirements.txt and both CI install lists).  Inheriting ruff's
#    default set meant the effective rule list moved under us whenever ruff
#    shipped; now a ruff upgrade is a deliberate edit in three places.
# 2. `scripts/scratch/` is excluded.  Those files are frozen evidence
#    (AGENTS.md: 原件冻结留档) and `evidence/` cites them by basename — a
#    reformat would rewrite history that nothing can re-derive.
#
# Scope note: every wide family is enabled as of 2026-11-05 (one commit per
# family: SIM/RET/PIE, PLW1510, BLE/S110, RUF, then FURB/UP/ISC/TRY/C4).  The
# final `select` is the list below.  The only rules left out are in `ignore`
# with a written reason: TRY003 (312 raise sites; built-in exceptions with
# messages are these tools' house style) and RUF001/002/003 (this tree's
# documentation is Chinese, so full-width punctuation is style, not ambiguity).
# A future widening is still a deliberate edit here, not a default change.
# top-level (not `[lint]`): ruff only accepts `exclude`/`extend-exclude` at the root.
extend-exclude = ["scripts/scratch"]

# The Windows host runs CPython 3.9 (the tree's byte-cache is `cpython-39`), and the
# plan's floor is 3.9+.  Declaring it keeps ruff from suggesting 3.10+/3.11+ idioms
# (`datetime.UTC`, un-quoted `X | None` without `from __future__ import annotations`)
# that would fail on the box the offline tools actually run on.
target-version = "py39"

[lint]
select = ["E4", "E7", "E9", "F", "W", "SIM", "RET", "PIE", "PLW1510", "BLE", "S110",
          "RUF", "FURB", "UP", "ISC", "TRY", "C4"]
ignore = [
    # `sys.path.insert(0, ...)` / `sys.stdout.reconfigure(...)` before the
    # imports they exist for is the house pattern in most tools and every test
    # file here.  Moving the imports above them would break the code, and a
    # per-file `# noqa` on 40 sites would be noise.
    "E402",
    # The four below are the pre-existing house-style decisions from the
    # original file; they are inert while their families are unselected, and
    # stay here so the ruling survives whoever widens `select`.
    "I001",    # import block is un-sorted or un-formatted
    "UP031",   # printf-string-formatting
    "B904",    # raise ... from err inside an except clause
    "B905",    # zip() without an explicit strict= parameter
    # RUF001/002/003 flag every full-width Chinese punctuation mark in comments,
    # docstrings and strings.  Those marks are this tree's documented house style
    # (AGENTS.md: 注释与文档写中文), not ambiguity: ~400 hits would all say the
    # same thing ("this sentence is Chinese").  Kept as an explicit ruling so a
    # future reader does not read the silence as an oversight.
    "RUF001",
    "RUF002",
    "RUF003",
    # TRY003 (raise-vanilla-args) would require a named exception class at every
    # `raise ValueError("...")` in the offline tools — 312 sites at the time this
    # family was enabled.  Those tools raise built-ins with an explanatory message
    # on purpose; introducing 312 one-line classes would be a different change, not
    # a lint cleanup.  The remaining TRY rules stay enabled.
    "TRY003",
]
