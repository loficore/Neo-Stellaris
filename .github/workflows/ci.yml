# CI gate — the PRIMARY one.  Runs on GitHub-hosted runners.
#
# Why GitHub and not the local Gitea act_runner: this repo is public, so
# standard-runner minutes are free and unmetered, which removes the only reason
# to host a runner.  `.gitea/workflows/ci.yml` still exists as a
# manual-dispatch copy for when GitHub is unreachable; it never fires on push.
#
# RULE: this file only ever runs *offline* gates.  Every `c1_*`/`c2_*` live
# shot, `scripts/windows/game_supervisor.py`, the popup/OCR family and the IDA
# sessions stay out on purpose: `docs/roadmap.md` §2 records the live-detour
# gate as 「只在点名时」 with a per-plan shot budget, so automating one would
# bypass the authorization gate rather than exercise it.  The corollary is that
# this pipeline needs no Windows capacity at all — the shipped DLL and
# `inject.exe` cross-compile on Linux and are never *run* here.
# `scripts/test_ci_workflows.py` pins both halves of that rule.
#
# The command list lives in the justfile (`just check-full`), not in this file,
# so a green local run and a green CI run are the same thing by construction.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned, and verified by sha256 before use: the toolchain version is part of
# what the tree asserts (build.zig.zon requires zig ≥ 0.16.0, and the shipped
# bytes are Debug-built by that compiler).  Bumping either pin is a deliberate
# edit here, not a floating tag that moves under us.
env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  JUST_VERSION: 1.59.0
  JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e

jobs:
  gate:
    # Pinned to an image, not `ubuntu-latest`: the shipped bytes are asserted
    # against this toolchain (glibc version included), and `ubuntu-latest`
    # migrates to Ubuntu 26 in October 2026 — a silent libc/codegen change under
    # a gate whose whole point is byte-exact artifacts.  Bump this deliberately.
    # glibc is a hard requirement either way: build.zig:44-47 explains that
    # QuickJS's bundled allocator misbehaves under musl, so an Alpine/musl
    # container would fail `zig build test` for a reason that has nothing to do
    # with the change.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Every hosted run starts on a fresh machine, so the QuickJS recompile is
      # the dominant cost (~2 min cold).  The cache is content-addressed by zig,
      # so a stale entry only costs a recompile, never a wrong result.
      - name: Cache zig build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon', 'libs/quickjs/**') }}
          restore-keys: |
            zig-${{ env.ZIG_VERSION }}-

      - name: Install toolchain (pinned, sha256-verified)
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          ln -sf /opt/zig/zig /usr/local/bin/zig

          curl -fsSL -o /tmp/just.tar.gz \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
          tar -xzf /tmp/just.tar.gz -C /usr/local/bin just

          # pytest + the two pinned offline-PE decoders (imported at module level
          # by the tools their tests cover) + psutil (windows-subpackage tests)
          # + ruff (the `just lint` step of `just check-full`).
          # `unicorn` is deliberately absent: only scripts/emu_desc.py needs it
          # and its artifacts are checked in, so the oracle is not a CI step.
          #
          # A venv outside the workspace, because the Ubuntu image is PEP 668
          # "externally managed" AND anything written into the tree would trip
          # the working-tree check at the end of this job.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check \
            'pytest==8.4.2' 'capstone==5.0.7' 'pefile==2024.8.26' psutil 'ruff==0.17.3'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

          zig version
          just --version
          "$RUNNER_TEMP/venv/bin/python" -m pytest --version
          "$RUNNER_TEMP/venv/bin/ruff" --version

      - name: "just check-full (build + 31 zig test roots + fences + drift + 1,461 python tests)"
        # `just check` alone covers only 418 of the 1,461 python tests: it runs
        # three fence files plus the windows subpackage, and never the
        # `test_c2_*_probe.py` / `test_c2_harness.py` contract layers.  That gap
        # is the main reason this pipeline exists.
        run: just check-full

      - name: zig build abi-probe (manual dispatch only)
        # Non-default step, never shipped, and by far the most expensive thing
        # here: measured 72 s cold vs 24 s for the whole `zig build test`.  Kept
        # off the per-push path but still exercised, so it cannot rot unnoticed.
        if: github.event_name == 'workflow_dispatch'
        run: zig build abi-probe

      - name: Artifact fingerprints
        # Written under zig-out/bin so the upload step has ONE root: upload-artifact
        # uses the least common ancestor of the search paths as the artifact root, and
        # a /tmp entry mixed with repo-relative ones would make that root "/" (the
        # download would then restore a nested tree and `dist/<name>` would not exist).
        run: sha256sum zig-out/bin/stellaris_quickjs.dll zig-out/bin/inject.exe | tee zig-out/bin/sha256sums.txt

      - name: Upload release artifacts
        # Uploaded on every gate run, not only tags: the step stays identical between
        # branch and tag, so a tag can never take a path no branch has exercised.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          if-no-files-found: error
          path: |
            zig-out/bin/stellaris_quickjs.dll
            zig-out/bin/inject.exe
            zig-out/bin/sha256sums.txt

      - name: Working tree must be untouched
        # The two drift fences are `--check`-only today (they regenerate in
        # memory and compare).  This step makes that a property of the pipeline
        # rather than a fact about the current generators: the moment someone
        # makes one of them write to disk, CI goes red instead of silently
        # committing regenerated bytes.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the gate mutated the working tree"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  release:
    # A GitHub Release is the only thing here with a side effect outside the repo, so
    # it is tag-only.  `needs: gate` is the whole point: the exact bytes that passed
    # the full gate are the bytes attached — a tag can never ship something no gate
    # has seen.  Publishing uses `gh` (already on the runner) instead of a third-party
    # release action, so the command stays auditable in this file.
    if: startsWith(github.ref, 'refs/tags/')
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --clobber \
            dist/stellaris_quickjs.dll dist/inject.exe dist/sha256sums.txt
